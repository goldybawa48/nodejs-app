stages:
  - build

variables:
  IMAGE_NAME: "goldybawa48/nodejs-project"

before_script:
  - export VERSION_FILE="nodejs-app/VERSION"
  - |
    if [ ! -f "$VERSION_FILE" ]; then
      echo "01" > "$VERSION_FILE"
    else
      VERSION=$(cat "$VERSION_FILE" | awk '{printf "%02d", $1+1}')
      echo "$VERSION" > "$VERSION_FILE"
    fi
  - export IMAGE_TAG=$(cat "$VERSION_FILE")

build_and_push:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - echo "$D_TOKEN" | docker login -u "$D_USERNAME" --password-stdin
    - docker build -f nodejs-app/multi-stage.dockerfile -t "$IMAGE_NAME:$IMAGE_TAG" nodejs-app/
    - docker push "$IMAGE_NAME:$IMAGE_TAG"

    # Commit the new version back to Git
    - git config --global user.email "gitlab@ci.com"
    - git config --global user.name "GitLab CI"
    - git add nodejs-app/VERSION
    - git commit -m "Updated image tag to $IMAGE_TAG"
    - git push https://oauth2:${GITHUB_TOKEN}@github.com/goldybawa48/nodejs-app.git main
  only:
    - main
